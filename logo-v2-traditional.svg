<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f5f5"/>
  
  <!-- Decorative square frame -->
  <rect x="20" y="20" width="160" height="160" fill="none" stroke="#c41e3a" stroke-width="3"/>
  <rect x="25" y="25" width="150" height="150" fill="none" stroke="#c41e3a" stroke-width="1"/>
  
  <!-- Corner decorations -->
  <circle cx="30" cy="30" r="3" fill="#c41e3a"/>
  <circle cx="170" cy="30" r="3" fill="#c41e3a"/>
  <circle cx="30" cy="170" r="3" fill="#c41e3a"/>
  <circle cx="170" cy="170" r="3" fill="#c41e3a"/>
  
  <!-- Main Chinese characters in grid -->
  <text x="50" y="70" font-size="32" font-weight="bold" fill="#c41e3a" text-anchor="middle" font-family="SimHei, Arial">勇掼</text>
  <text x="150" y="70" font-size="32" font-weight="bold" fill="#c41e3a" text-anchor="middle" font-family="SimHei, Arial">三君</text>
  
  <!-- Decorative line -->
  <line x1="40" y1="85" x2="160" y2="85" stroke="#c41e3a" stroke-width="1"/>
  
  <!-- Brand text -->
  <text x="100" y="130" font-size="14" font-weight="bold" fill="#c41e3a" text-anchor="middle" font-family="SimHei, Arial">品牌商城</text>
  <text x="100" y="150" font-size="10" fill="#666" text-anchor="middle" font-family="Arial">BRAND MALL</text>
</svg>